name: Local package

# Builds the DMG via the project's own package.sh, signed with a stable
# self-signed identity ("PasteMemo Local Signing", imported from repo
# secrets). A stable identity keeps macOS TCC grants (Screen Recording,
# Accessibility) valid across rebuilds; ad-hoc signatures break them on
# every install. Gatekeeper bypass on install is still required
# (xattr -cr /Applications/PasteMemo.app).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.PASTEMEMO_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.PASTEMEMO_SIGNING_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/pastememo-signing.p12
          openssl pkcs12 -in /tmp/pastememo-signing.p12 -passin "pass:$P12_PASSWORD" -nodes -nokeys -out /tmp/signing-cert.pem
          openssl pkcs12 -in /tmp/pastememo-signing.p12 -passin "pass:$P12_PASSWORD" -nodes -nocerts -out /tmp/signing-key.pem
          # Dedicated keychain + partition list: without the partition-list grant,
          # codesign's key access pops an authorization dialog that hangs forever
          # on a headless runner.
          security create-keychain -p pastememo-build build.keychain
          security import /tmp/signing-cert.pem -k build.keychain
          security import /tmp/signing-key.pem -k build.keychain -T /usr/bin/codesign
          security list-keychain -d user -s build.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k pastememo-build build.keychain
          # sudo + admin-domain trust: the user-domain variant pops an authorization
          # dialog that no one can dismiss on a headless runner (hangs the step).
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain /tmp/signing-cert.pem
          rm -f /tmp/pastememo-signing.p12 /tmp/signing-cert.pem /tmp/signing-key.pem

      - name: Package DMG
        env:
          VERSION: "0.0.${{ github.run_number }}"
          CODESIGN_IDENTITY: "PasteMemo Local Signing"
        run: bash scripts/package.sh

      - name: Verify signature
        run: codesign -dv --verbose=2 dist/PasteMemo.app 2>&1 | grep -E 'Authority|Identifier=' || true

      - uses: actions/upload-artifact@v4
        with:
          name: PasteMemo-dmg-${{ github.run_number }}
          path: dist/*.dmg
          if-no-files-found: error
